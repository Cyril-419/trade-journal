<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyril's Trade Journal</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-theme="dark">
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">📊 Journal</div>
        <button id="sidebarToggle">☰</button>
      </div>
      <nav class="sidebar-nav collapsed">
        <button data-page="dashboard" class="nav-link active">Dashboard</button>
        <button data-page="journal" class="nav-link">Journal</button>
        <button data-page="analytics" class="nav-link">Analytics</button>
        <button data-page="calendar" class="nav-link">Calendar</button>
        <button data-page="settings" class="nav-link">Settings</button>
      </nav>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="main-header">
        <h1>Cyril's Trade Journal</h1>
        <div>
          <button id="exportCSV">📤 Export CSV</button>
          <button id="themeToggle">🌗</button>
        </div>
      </header>

      <main class="page-container">
        <!-- Dashboard -->
        <section id="dashboard-page" class="page active fade-in">
          <h2>Dashboard</h2>
          <div class="metrics">
            <div class="card">Total Trades: <span id="totalTrades">0</span></div>
            <div class="card">Win Rate: <span id="winRate">0%</span></div>
            <div class="card">Avg PnL: <span id="avgPnl">$0.00</span></div>
          </div>
          <div class="chart-section">
            <canvas id="winLossChart" height="100"></canvas>
          </div>
        </section>
        <!-- Other sections omitted for brevity -->
      </main>
    </div>
  </div>

  <!-- Modal omitted for brevity -->

  <script src="app.js"></script>
</body>
</html>
